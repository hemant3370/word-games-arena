<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Download Word Games Arena</title>
    <script>
      (() => {
        const appStoreUrl = "https://apps.apple.com/app/id6823714719";
        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.hemant3370.wordgames";
        const downloadPageUrl = "../#download";
        const userAgent = navigator.userAgent || navigator.vendor || "";
        const isAndroid = /android/i.test(userAgent);
        const isIOS =
          /iPad|iPhone|iPod/.test(userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
          window.location.replace(appStoreUrl);
        } else if (isAndroid) {
          window.location.replace(playStoreUrl);
        } else {
          window.location.replace(downloadPageUrl);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Download Word Games Arena</h1>
      <p>Choose your app store:</p>
      <p><a href="https://apps.apple.com/app/id6823714719">Download on the App Store</a></p>
      <p><a href="https://play.google.com/store/apps/details?id=com.hemant3370.wordgames">Get it on Google Play</a></p>
    </main>
  </body>
</html>
